name = "fertility-fund"
main = "worker.ts"
compatibility_date = "2026-04-21"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "fertilityfund"
database_id = "a715c124-c60f-43f4-ba59-afe68ccc5a00"
migrations_dir = "migrations"

[observability]
[observability.logs]
enabled = true
invocation_logs = true
[observability.traces]
enabled = true