name = "p2p"
main = "worker.ts"
compatibility_date = "2026-04-21"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[[routes]]
pattern = "postcodetoparenthood.org.uk"
custom_domain = true

[[routes]]
pattern = "www.postcodetoparenthood.org.uk"
custom_domain = true

[build]
command = "npm run build"

[alias]
"virtual:react-router/server-build" = "./build/server/index.js"

[assets]
directory = "./build/client"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "fertilityfund"
database_id = "0d01ebee-9961-4da7-a402-87ec678b48e8"
migrations_dir = "migrations"

[observability]
[observability.logs]
enabled = true
invocation_logs = true
[observability.traces]
enabled = true

[[r2_buckets]]
binding = "r2bucket"
bucket_name = "fertilityfund"
