name = "fertility-fund"
main = "worker.ts"
compatibility_date = "2026-04-21"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "fertilityfund"
database_id = "0d01ebee-9961-4da7-a402-87ec678b48e8"
migrations_dir = "migrations"

[observability]
[observability.logs]
enabled = true
invocation_logs = true
[observability.traces]
enabled = true

[triggers]
crons = ["0 3 1 * *"]

# Admin credentials — set via Wrangler secrets (do NOT commit real values here):
#   wrangler secret put ADMIN_USERNAME
#   wrangler secret put ADMIN_PASSWORD
# [vars]
# ADMIN_USERNAME = "admin"
# ADMIN_PASSWORD = "changeme"
